name: Release MultiTrack Audio EX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (e.g. 2.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_name: ${{ steps.v.outputs.tag_name }}
      checkout_ref: ${{ steps.v.outputs.checkout_ref }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Run a manual release from the main branch."
              exit 1
            fi
            VER="${DISPATCH_VERSION#v}"
            TAG="v${VER}"
            CHECKOUT_REF="refs/heads/main"
          else
            TAG="$REF_NAME"
            VER="${TAG#v}"
            CHECKOUT_REF="refs/tags/$TAG"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${CHECKOUT_REF}" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deterministic release archive
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/package-release.js "$VERSION"
          ZIP_PATH="release/FugsMultiTrackAudioEX-v${VERSION}.zip"
          test -f "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Fugs MultiTrack Audio EX ${{ needs.prepare.outputs.tag_name }}
          body: |
            Deterministic install archive generated by scripts/package-release.js.
            Run the full verification gate locally before pushing the release tag.
          files: ${{ steps.package.outputs.zip_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify shared plugin directory
        env:
          GH_TOKEN: ${{ secrets.FUGS_SITE_SYNC_TOKEN }}
          DIRECTORY_REPO: SpaceFoon/RPG-Maker-MV-MZ-plugins
          PLUGIN_SLUG: fugs-multi-track-audio-ex
          PLUGIN_NAME: Fugs MultiTrack Audio EX
          SHORT_NAME: FugsMultiTrackAudioEX
          CATEGORY: Audio
          COMPATIBILITY: MZ/MV
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FILES: |
            FugsMultiTrackAudioEX.js
            FugsAudio0Docs.js
            FugsAudio2Effects.js
            FugsAudio3Spatial.js
            FugsAudio4Dynamics.js
            FugsAudio5Switch.js
            FugsAudio6Aliases.js
            FugsAudio7Compat.js
            dist/FugsMultiTrackAudioEX.bundle.js
            LICENSE
            README.md
        run: |
          set -euo pipefail
          export RELEASE_ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/FugsMultiTrackAudioEX-v${VERSION}.zip"
          export EVENT_PATH="/tmp/plugin-directory-release-event.json"

          node <<'NODE'
          const fs = require("fs");
          const files = process.env.FILES.split(/\r?\n/)
            .map((file) => file.trim())
            .filter(Boolean);
          const javascriptFiles = files.filter((file) => /\.js$/i.test(file));
          const source = javascriptFiles.map((file) => fs.readFileSync(file, "utf8")).join("\n");
          const description = source.match(/^\s*\*\s*@plugindesc\s+(.+)$/m)?.[1]?.trim() ?? "";
          const license = source.match(/^\s*\*\s*@license\s+(.+)$/m)?.[1]?.trim() ?? "";
          const event = {
            event_type: "plugin-release",
            client_payload: {
              slug: process.env.PLUGIN_SLUG,
              name: process.env.PLUGIN_NAME,
              shortName: process.env.SHORT_NAME,
              version: process.env.VERSION,
              tagName: process.env.TAG_NAME,
              repository: process.env.GITHUB_REPOSITORY,
              releaseZipUrl: process.env.RELEASE_ZIP_URL,
              files,
              category: process.env.CATEGORY,
              compatibility: process.env.COMPATIBILITY,
              compatibilityConfirmed: true,
              description: description.replace(/^\[v[^\]]+\]\s*/, ""),
              license,
            },
          };
          fs.writeFileSync(process.env.EVENT_PATH, JSON.stringify(event), "utf8");
          NODE

          gh api "repos/$DIRECTORY_REPO/dispatches" --input "$EVENT_PATH"
