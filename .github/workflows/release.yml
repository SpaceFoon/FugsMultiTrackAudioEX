name: Release MultiTrack Audio EX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (e.g. 2.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_name: ${{ steps.v.outputs.tag_name }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VER="${DISPATCH_VERSION#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=v${VER}" >> "$GITHUB_OUTPUT"
          else
            TAG="$REF_NAME"
            VER="${TAG#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    uses: SpaceFoon/RPG-Maker-MV-MZ-plugins/.github/workflows/release-plugin.yml@main
    with:
      plugin_slug: fugs-multi-track-audio-ex
      plugin_name: Fugs MultiTrack Audio EX
      short_name: FugsMultiTrackAudioEX
      version: ${{ needs.prepare.outputs.version }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      category: Audio
      compatibility: MZ/MV
      files: |
        FugsMultiTrackAudioEX.js
        FugsAudio0Docs.js
        FugsAudio2Effects.js
        FugsAudio3Spatial.js
        FugsAudio4Dynamics.js
        FugsAudio5Switch.js
        FugsAudio6Aliases.js
        FugsAudio7Compat.js
        dist/FugsMultiTrackAudioEX.bundle.js
        LICENSE
        README.md
      install_notes: |
        Enable Core first, then Docs and the optional satellite plugins you use.
        Put FugsAudio7Compat after OcRam when applicable.
        Do not enable the all-in-one bundle together with satellites 2-7.
    secrets:
      FUGS_SITE_SYNC_TOKEN: ${{ secrets.FUGS_SITE_SYNC_TOKEN }}
